AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Kestrion CDC pipeline - ingest: RDS PostgreSQL source (logical replication on)
  and a DMS full-load + CDC task that writes Parquet to the S3 raw zone.

Parameters:
  NamePrefix:
    Type: String
    Default: kestrion-iac
    AllowedPattern: '^[a-z][a-z0-9-]{2,24}$'
  DataBucketName:
    Type: String
    Description: Bucket created by the foundation stack.
  DmsS3RoleArn:
    Type: String
    Description: Role DMS assumes to write to the bucket (foundation output).
  VpcId:
    Type: AWS::EC2::VPC::Id
  SubnetIds:
    Type: 'List<AWS::EC2::Subnet::Id>'
    Description: At least two subnets in different Availability Zones.
  MyIpCidr:
    Type: String
    AllowedPattern: '^\d{1,3}(\.\d{1,3}){3}/32$'
    Description: Your public IP as a /32, allowed to reach PostgreSQL for seeding.
  DbPassword:
    Type: String
    NoEcho: true
    AllowedPattern: '^[A-Za-z0-9]{8,64}$'
    Description: Master password for the source database (letters and digits only).
  DbName:
    Type: String
    Default: kestriondb
    AllowedPattern: '^[a-z][a-z0-9_]{0,62}$'
  SlotName:
    Type: String
    Default: kestrion_iac_dms
    AllowedPattern: '^[a-z][a-z0-9_]{0,62}$'
    Description: Logical replication slot DMS creates (no hyphens allowed).

Resources:
  DmsSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: DMS replication instance
      VpcId: !Ref VpcId

  RdsSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Source PostgreSQL - DMS and the operator
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref DmsSg
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          CidrIp: !Ref MyIpCidr

  DbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupName: !Sub '${NamePrefix}-db-subnets'
      DBSubnetGroupDescription: Source database subnets
      SubnetIds: !Ref SubnetIds

  DbParameterGroup:
    Type: AWS::RDS::DBParameterGroup
    Properties:
      Description: Logical replication so DMS can read the change stream
      Family: postgres16
      Parameters:
        rds.logical_replication: '1'

  SourceDb:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Delete
    Properties:
      DBInstanceIdentifier: !Sub '${NamePrefix}-source'
      Engine: postgres
      EngineVersion: '16'
      DBInstanceClass: db.t3.micro
      AllocatedStorage: '20'
      StorageType: gp3
      StorageEncrypted: true
      MultiAZ: false
      DBName: !Ref DbName
      MasterUsername: postgres
      MasterUserPassword: !Ref DbPassword
      PubliclyAccessible: true
      VPCSecurityGroups:
        - !Ref RdsSg
      DBSubnetGroupName: !Ref DbSubnetGroup
      DBParameterGroupName: !Ref DbParameterGroup
      BackupRetentionPeriod: 1
      DeleteAutomatedBackups: true
      DeletionProtection: false

  DmsSubnetGroup:
    Type: AWS::DMS::ReplicationSubnetGroup
    Properties:
      ReplicationSubnetGroupIdentifier: !Sub '${NamePrefix}-dms-subnets'
      ReplicationSubnetGroupDescription: Kestrion DMS subnets
      SubnetIds: !Ref SubnetIds

  ReplicationInstance:
    Type: AWS::DMS::ReplicationInstance
    DependsOn: DmsSubnetGroup
    Properties:
      ReplicationInstanceIdentifier: !Sub '${NamePrefix}-dms-ri'
      ReplicationInstanceClass: dms.t3.micro
      AllocatedStorage: 20
      MultiAZ: false
      PubliclyAccessible: true
      VpcSecurityGroupIds:
        - !Ref DmsSg
      ReplicationSubnetGroupIdentifier: !Sub '${NamePrefix}-dms-subnets'

  SourceEndpoint:
    Type: AWS::DMS::Endpoint
    Properties:
      EndpointIdentifier: !Sub '${NamePrefix}-pg-source'
      EndpointType: source
      EngineName: postgres
      ServerName: !GetAtt SourceDb.Endpoint.Address
      Port: 5432
      DatabaseName: !Ref DbName
      Username: postgres
      Password: !Ref DbPassword
      SslMode: require
      ExtraConnectionAttributes: !Sub 'slotName=${SlotName}'

  TargetEndpoint:
    Type: AWS::DMS::Endpoint
    Properties:
      EndpointIdentifier: !Sub '${NamePrefix}-s3-target'
      EndpointType: target
      EngineName: s3
      S3Settings:
        BucketName: !Ref DataBucketName
        BucketFolder: raw
        ServiceAccessRoleArn: !Ref DmsS3RoleArn
        DataFormat: parquet
        IncludeOpForFullLoad: true
        TimestampColumnName: ts
        DatePartitionEnabled: true
        ParquetTimestampInMillisecond: true
        CdcMaxBatchInterval: 30

  ReplicationTask:
    Type: AWS::DMS::ReplicationTask
    Properties:
      ReplicationTaskIdentifier: !Sub '${NamePrefix}-full-cdc'
      MigrationType: full-load-and-cdc
      ReplicationInstanceArn: !Ref ReplicationInstance
      SourceEndpointArn: !Ref SourceEndpoint
      TargetEndpointArn: !Ref TargetEndpoint
      TableMappings: >-
        {"rules":[{"rule-type":"selection","rule-id":"1","rule-name":"include-public","object-locator":{"schema-name":"public","table-name":"%"},"rule-action":"include"}]}

Outputs:
  DbHost:
    Value: !GetAtt SourceDb.Endpoint.Address
  DbName:
    Value: !Ref DbName
  ReplicationTaskArn:
    Value: !Ref ReplicationTask
  ReplicationTaskId:
    Value: !Sub '${NamePrefix}-full-cdc'
